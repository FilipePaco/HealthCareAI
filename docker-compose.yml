# Orquestração local (paridade com o ambiente Railway).
# No Railway: o Postgres é um serviço gerenciado (plugin) e a API/Streamlit usam o mesmo Dockerfile;
# este compose existe para rodar tudo localmente com um comando.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: srag
      POSTGRES_PASSWORD: srag
      POSTGRES_DB: srag
    ports:
      - "5433:5432"   # host 5433 (evita conflito com Postgres local na 5432); app usa db:5432 interno
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srag"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      args:
        # instala os extras de tracing na imagem; sem isso TRACING_ENABLED não tem efeito
        INSTALL_OBS: ${INSTALL_OBS:-true}
    command: sh -c "uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg2://srag:srag@db:5432/srag
      LLM_PROVIDER: ${LLM_PROVIDER:-google_genai}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash-lite}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      API_KEY: ${API_KEY:-change-me-local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501}
      # Tracing (camada 2, ADR-13) — opcional; ausente = desligado
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-docker}
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src        # hot-reload em dev
    depends_on:
      db:
        condition: service_healthy

  streamlit:
    build: .
    command: sh -c "streamlit run app_streamlit.py --server.port 8501 --server.address 0.0.0.0"
    environment:
      API_BASE_URL: http://api:8000
      API_KEY: ${API_KEY:-change-me-local}
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
